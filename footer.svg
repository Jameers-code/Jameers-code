 <svg width="1200" height="450" viewBox="0 0 1200 450" fill="none"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Background -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#07132C"/>
      <stop offset="55%" stop-color="#030914"/>
      <stop offset="100%" stop-color="#01040A"/>
    </radialGradient>

    <!-- Blue glow -->
    <radialGradient id="blueGlow">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Text gradients -->
    <linearGradient id="learn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#168BFF"/>
      <stop offset="100%" stop-color="#00B7FF"/>
    </linearGradient>

    <linearGradient id="build" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF8B24"/>
      <stop offset="100%" stop-color="#FFC15A"/>
    </linearGradient>

    <linearGradient id="deploy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A83BFF"/>
      <stop offset="100%" stop-color="#D63CFF"/>
    </linearGradient>

    <!-- Gold GitHub badge -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD21C"/>
      <stop offset="50%" stop-color="#FFB400"/>
      <stop offset="100%" stop-color="#FF7A00"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="smallGlow">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- ================= BACKGROUND ================= -->

  <rect width="1200" height="450" fill="url(#bgGlow)"/>

  <!-- Subtle blue atmospheric glow -->
  <ellipse cx="150" cy="155" rx="260" ry="150" fill="url(#blueGlow)"/>
  <ellipse cx="900" cy="250" rx="350" ry="180" fill="url(#blueGlow)" opacity="0.25"/>

  <!-- ================= STARS ================= -->

  <g fill="#FFFFFF">

    <circle cx="65" cy="105" r="1.4"/>
    <circle cx="105" cy="75" r="1"/>
    <circle cx="155" cy="150" r="1.2"/>
    <circle cx="205" cy="55" r="1"/>
    <circle cx="270" cy="125" r="1.3"/>
    <circle cx="330" cy="80" r="0.8"/>
    <circle cx="410" cy="105" r="1"/>
    <circle cx="470" cy="50" r="0.8"/>
    <circle cx="535" cy="140" r="1"/>
    <circle cx="610" cy="85" r="0.8"/>
    <circle cx="680" cy="120" r="1.1"/>
    <circle cx="755" cy="65" r="0.7"/>
    <circle cx="825" cy="150" r="1"/>
    <circle cx="900" cy="90" r="0.7"/>
    <circle cx="975" cy="135" r="1"/>
    <circle cx="1040" cy="65" r="0.8"/>
    <circle cx="1110" cy="110" r="1.1"/>

    <circle cx="90" cy="230" r="0.7"/>
    <circle cx="160" cy="275" r="1"/>
    <circle cx="300" cy="220" r="0.8"/>
    <circle cx="455" cy="260" r="0.7"/>
    <circle cx="590" cy="215" r="0.8"/>
    <circle cx="735" cy="255" r="0.8"/>
    <circle cx="900" cy="220" r="0.7"/>
    <circle cx="1040" cy="250" r="1"/>
    <circle cx="1140" cy="205" r="0.8"/>

  </g>

  <!-- Bright stars -->
  <g fill="#4DA3FF" filter="url(#smallGlow)">
    <circle cx="72" cy="120" r="2"/>
    <circle cx="390" cy="105" r="1.8"/>
    <circle cx="680" cy="120" r="1.7"/>
    <circle cx="1010" cy="130" r="1.8"/>
  </g>

  <!-- ================= MAIN HEADING ================= -->

  <text x="105" y="155"
        font-family="Arial, Helvetica, sans-serif"
        font-size="62"
        font-weight="800"
        letter-spacing="-2">

    <tspan fill="url(#learn)">Learn.</tspan>
    <tspan dx="14" fill="url(#build)">Build.</tspan>
    <tspan dx="14" fill="url(#deploy)">Deploy.</tspan>

  </text>

  <!-- ================= SUB HEADING ================= -->

  <text x="105" y="215"
        font-family="Arial, Helvetica, sans-serif"
        font-size="47"
        font-weight="800"
        letter-spacing="-1"
        fill="#F5F7FA">
    Production-Ready Code
  </text>

  <!-- Blue dot -->
  <circle cx="817" cy="201" r="7" fill="#009DFF" filter="url(#glow)"/>

  <!-- ================= YOUTUBE ================= -->

  <g transform="translate(105 270)">

    <rect x="0" y="0"
          width="58" height="40"
          rx="12"
          fill="#FF0033"/>

    <path d="M23 11L23 29L40 20L23 11Z"
          fill="white"/>

    <text x="75" y="29"
          font-family="Arial, Helvetica, sans-serif"
          font-size="25"
          font-weight="700"
          fill="#F4F7FB">
      Jameer.dev
    </text>

  </g>

  <!-- Divider -->
  <text x="355" y="300"
        font-family="Arial"
        font-size="30"
        fill="#E6EAF0">
    |
  </text>

  <!-- ================= INSTAGRAM ================= -->

  <g transform="translate(390 270)">

    <rect x="0" y="0"
          width="58"
          height="40"
          rx="12"
          fill="url(#instagramGradient)"/>

    <defs>
      <linearGradient id="instagramGradient"
                      x1="0" y1="1" x2="1" y2="0">
        <stop offset="0%" stop-color="#FFB000"/>
        <stop offset="45%" stop-color="#FF006A"/>
        <stop offset="100%" stop-color="#8A2BE2"/>
      </linearGradient>
    </defs>

    <rect x="14" y="10"
          width="30"
          height="30"
          rx="9"
          transform="translate(0 -5)"
          stroke="white"
          stroke-width="3"
          fill="none"/>

    <circle cx="29" cy="20"
            r="7"
            stroke="white"
            stroke-width="3"
            fill="none"/>

    <circle cx="39" cy="11"
            r="2.2"
            fill="white"/>

    <text x="75" y="29"
          font-family="Arial, Helvetica, sans-serif"
          font-size="25"
          font-weight="700"
          fill="#F4F7FB">
      Jameer.dev
    </text>

  </g>

  <!-- Divider -->
  <text x="675" y="300"
        font-family="Arial"
        font-size="30"
        fill="#E6EAF0">
    |
  </text>

  <!-- ================= LINKEDIN ================= -->

  <g transform="translate(710 270)">

    <rect x="0" y="0"
          width="58"
          height="40"
          rx="8"
          fill="#0A78D1"/>

    <text x="10" y="30"
          font-family="Arial, Helvetica, sans-serif"
          font-size="28"
          font-weight="800"
          fill="white">
      in
    </text>

    <text x="75" y="29"
          font-family="Arial, Helvetica, sans-serif"
          font-size="25"
          font-weight="700"
          fill="#F4F7FB">
      Jameer Ahmed
    </text>

  </g>

  <!-- ================= GOLDEN STAR ================= -->

  <g transform="translate(1000 100)" filter="url(#glow)">

    <!-- Star -->
    <path d="
      M75 0
      L94 49
      L147 53
      L106 87
      L119 140
      L75 111
      L31 140
      L44 87
      L3 53
      L56 49
      Z"
      fill="url(#gold)"
      stroke="#FFD52A"
      stroke-width="5"/>

    <!-- Inner star -->
    <path d="
      M75 15
      L89 55
      L132 58
      L99 83
      L109 124
      L75 101
      L41 124
      L51 83
      L18 58
      L61 55
      Z"
      fill="#FF9800"
      opacity="0.75"/>

    <!-- GitHub-style Octocat silhouette -->
    <g transform="translate(45 43)" fill="#FFD21C">

      <path d="
        M30 0
        C19 0 10 7 7 17
        C3 19 0 24 0 30
        C0 37 5 42 12 42
        C16 42 19 40 22 37
        C25 39 35 39 38 37
        C41 40 44 42 48 42
        C55 42 60 37 60 30
        C60 24 57 19 53 17
        C50 7 41 0 30 0
        Z"/>

      <path d="
        M12 37
        C10 46 12 54 17 60
        C20 63 23 61 22 57
        C21 52 22 48 25 44
        Z"/>

      <path d="
        M48 37
        C50 46 48 54 43 60
        C40 63 37 61 38 57
        C39 52 38 48 35 44
        Z"/>

    </g>

  </g>

  <!-- ================= CURVED HORIZON ================= -->

  <path d="
    M80 390
    C330 300 690 295 1130 380"
    stroke="#0057C7"
    stroke-width="2"
    opacity="0.65"
    fill="none"/>

  <path d="
    M100 391
    C350 315 700 310 1110 382"
    stroke="#001F52"
    stroke-width="8"
    opacity="0.25"
    fill="none"/>

</svg>
