<svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" width="1000" height="420">
  <defs>
    <!-- Dark background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0d0d;stop-opacity:1" />
    </linearGradient>
    <!-- Card gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2e2e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1e1e;stop-opacity:1" />
    </linearGradient>
    <!-- Subtle vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" style="stop-color:#000000;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.6" />
    </radialGradient>
    <!-- Card shadow filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <!-- Subtle noise texture -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="overlay" result="noisy"/>
      <feComposite in="noisy" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="420" fill="url(#bgGrad)"/>
  <!-- Subtle texture overlay -->
  <rect width="1000" height="420" fill="#222" opacity="0.3" filter="url(#noise)"/>
  <!-- Vignette overlay -->
  <rect width="1000" height="420" fill="url(#vignette)"/>

  <!-- NAME: JAMEER AHMED in large serif/display style -->
  <text x="500" y="115"
    font-family="'Georgia', 'Times New Roman', serif"
    font-size="92"
    font-weight="400"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="8"
    style="font-variant: small-caps;">JAMEER AHMED</text>

  <!-- Subtitle: FULL STACK DEVELOPER -->
  <text x="500" y="158"
    font-family="'Trebuchet MS', 'Arial', sans-serif"
    font-size="22"
    font-weight="300"
    fill="#cccccc"
    text-anchor="middle"
    letter-spacing="10">FULL STACK DEVELOPER</text>

  <!-- ===== CARD 1: MICROSOFT ===== -->
  <!-- Card background -->
  <rect x="58" y="200" width="190" height="185" rx="18" ry="18" fill="url(#cardGrad)" filter="url(#cardShadow)"/>
  <rect x="58" y="200" width="190" height="185" rx="18" ry="18" fill="none" stroke="#3a3a3a" stroke-width="1"/>

  <!-- Microsoft Logo (4 colored squares) -->
  <!-- Red square -->
  <rect x="128" y="225" width="22" height="22" fill="#F25022"/>
  <!-- Green square -->
  <rect x="153" y="225" width="22" height="22" fill="#7FBA00"/>
  <!-- Blue square -->
  <rect x="128" y="250" width="22" height="22" fill="#00A4EF"/>
  <!-- Yellow square -->
  <rect x="153" y="250" width="22" height="22" fill="#FFB900"/>

  <!-- Microsoft text -->
  <text x="153" y="307"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-size="15"
    font-weight="800"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="0.5">MICROSOFT</text>
  <text x="153" y="326"
    font-family="'Arial', sans-serif"
    font-size="13"
    font-weight="400"
    fill="#bbbbbb"
    text-anchor="middle">STUDENT</text>
  <text x="153" y="344"
    font-family="'Arial', sans-serif"
    font-size="13"
    font-weight="400"
    fill="#bbbbbb"
    text-anchor="middle">AMBASSADOR</text>

  <!-- ===== CARD 2: AWS ===== -->
  <rect x="270" y="200" width="190" height="185" rx="18" ry="18" fill="url(#cardGrad)" filter="url(#cardShadow)"/>
  <rect x="270" y="200" width="190" height="185" rx="18" ry="18" fill="none" stroke="#3a3a3a" stroke-width="1"/>

  <!-- AWS Logo text "aws" -->
  <text x="365" y="258"
    font-family="'Arial Black', 'Helvetica Neue', sans-serif"
    font-size="30"
    font-weight="900"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="1">aws</text>
  <!-- AWS smile arrow (orange arc) -->
  <path d="M 325 268 Q 365 285 405 268"
    fill="none"
    stroke="#FF9900"
    stroke-width="3"
    stroke-linecap="round"/>
  <!-- Arrow tip on the right -->
  <polygon points="403,262 409,268 403,274" fill="#FF9900"/>

  <!-- AWS text -->
  <text x="365" y="307"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-size="15"
    font-weight="800"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="0.5">AWS</text>
  <text x="365" y="326"
    font-family="'Arial', sans-serif"
    font-size="13"
    font-weight="400"
    fill="#bbbbbb"
    text-anchor="middle">CLOUD</text>
  <text x="365" y="344"
    font-family="'Arial', sans-serif"
    font-size="13"
    font-weight="400"
    fill="#bbbbbb"
    text-anchor="middle">CAPTAIN</text>

  <!-- ===== CARD 3: GOOGLE ===== -->
  <rect x="482" y="200" width="190" height="185" rx="18" ry="18" fill="url(#cardGrad)" filter="url(#cardShadow)"/>
  <rect x="482" y="200" width="190" height="185" rx="18" ry="18" fill="none" stroke="#3a3a3a" stroke-width="1"/>

  <!-- Google Developer Groups Logo (pill shapes) -->
  <!-- Blue pill (left, angled) -->
  <rect x="539" y="228" width="38" height="18" rx="9" ry="9" fill="#4285F4" transform="rotate(-30 558 237)"/>
  <!-- Red pill (top right, angled) -->
  <rect x="566" y="228" width="38" height="18" rx="9" ry="9" fill="#EA4335" transform="rotate(30 585 237)"/>
  <!-- Yellow pill (bottom left, angled) -->
  <rect x="539" y="252" width="38" height="18" rx="9" ry="9" fill="#FBBC05" transform="rotate(30 558 261)"/>
  <!-- Green pill (bottom right, angled) -->
  <rect x="566" y="252" width="38" height="18" rx="9" ry="9" fill="#34A853" transform="rotate(-30 585 261)"/>

  <!-- Google text -->
  <text x="577" y="307"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-size="15"
    font-weight="800"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="0.5">GOOGLE</text>
  <text x="577" y="326"
    font-family="'Arial', sans-serif"
    font-size="13"
    font-weight="400"
    fill="#bbbbbb"
    text-anchor="middle">DEVELOPER</text>
  <text x="577" y="344"
    font-family="'Arial', sans-serif"
    font-size="13"
    font-weight="400"
    fill="#bbbbbb"
    text-anchor="middle">GROUPS</text>

  <!-- ===== CARD 4: LEETCODE ===== -->
  <rect x="694" y="200" width="190" height="185" rx="18" ry="18" fill="url(#cardGrad)" filter="url(#cardShadow)"/>
  <rect x="694" y="200" width="190" height="185" rx="18" ry="18" fill="none" stroke="#3a3a3a" stroke-width="1"/>

  <!-- LeetCode Logo (stylized C with < and = ) -->
  <!-- Outer orange arc -->
  <path d="M 789 233 A 21 21 0 0 0 789 275"
    fill="none"
    stroke="#FFA116"
    stroke-width="8"
    stroke-linecap="round"/>
  <!-- < chevron (grey) -->
  <polyline points="780,243 768,254 780,265"
    fill="none"
    stroke="#B3B3B3"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"/>
  <!-- = two lines (grey) -->
  <line x1="773" y1="250" x2="787" y2="250" stroke="#B3B3B3" stroke-width="4" stroke-linecap="round"/>
  <line x1="773" y1="259" x2="787" y2="259" stroke="#B3B3B3" stroke-width="4" stroke-linecap="round"/>

  <!-- Leetcode text -->
  <text x="789" y="307"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-size="15"
    font-weight="800"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="0.5">LEETCODE</text>
  <text x="789" y="326"
    font-family="'Arial', sans-serif"
    font-size="13"
    font-weight="400"
    fill="#bbbbbb"
    text-anchor="middle">PROBLEM</text>
  <text x="789" y="344"
    font-family="'Arial', sans-serif"
    font-size="13"
    font-weight="400"
    fill="#bbbbbb"
    text-anchor="middle">SOLVING</text>

</svg>
