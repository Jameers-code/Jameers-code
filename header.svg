<svg width="100%" viewBox="0 0 1600 800" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Jameer Ahmed – Full Stack Developer</title>
  <desc>Professional profile banner with credential badges</desc>
  
  <!-- Black Background with subtle gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1f3a;stop-opacity:1" />
    </linearGradient>
    
    <filter id="cardShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <rect width="1600" height="800" fill="url(#bgGradient)"/>
  
  <!-- Main Title -->
  <text x="800" y="180" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="140" font-weight="400" letter-spacing="8" fill="#ffffff">JAMEER AHMED</text>
  
  <!-- Subtitle -->
  <text x="800" y="280" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="56" font-weight="400" letter-spacing="12" fill="#888888">FULL STACK DEVELOPER</text>
  
  <!-- Horizontal Divider Line -->
  <line x1="350" y1="320" x2="1250" y2="320" stroke="#555555" stroke-width="2"/>
  
  <!-- Card 1: Microsoft -->
  <g filter="url(#cardShadow)">
    <rect x="120" y="380" width="340" height="360" rx="25" fill="#1a1f3a" stroke="#333333" stroke-width="1"/>
    
    <!-- Microsoft Logo (4 squares) -->
    <rect x="220" y="430" width="45" height="45" fill="#F25022"/>
    <rect x="280" y="430" width="45" height="45" fill="#7FBA00"/>
    <rect x="220" y="490" width="45" height="45" fill="#00A4EF"/>
    <rect x="280" y="490" width="45" height="45" fill="#FFB900"/>
    
    <!-- Text -->
    <text x="290" y="610" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="1">MICROSOFT</text>
    <text x="290" y="655" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="28" fill="#888888" letter-spacing="0.5">STUDENT</text>
    <text x="290" y="695" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="28" fill="#888888" letter-spacing="0.5">AMBASSADOR</text>
  </g>
  
  <!-- Card 2: AWS -->
  <g filter="url(#cardShadow)">
    <rect x="520" y="380" width="340" height="360" rx="25" fill="#0d2d4a" stroke="#1a5a7a" stroke-width="2"/>
    
    <!-- AWS Text and Arrow -->
    <text x="690" y="490" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="80" font-weight="900" fill="#ffffff" letter-spacing="-3">aws</text>
    <path d="M640,530 Q690,565 740,530" fill="none" stroke="#FF9900" stroke-width="6" stroke-linecap="round"/>
    <polygon points="640,530 630,520 635,540" fill="#FF9900"/>
    <polygon points="740,530 750,520 745,540" fill="#FF9900"/>
    
    <!-- Text -->
    <text x="690" y="635" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="1">AWS</text>
    <text x="690" y="680" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="28" fill="#888888" letter-spacing="0.5">CLOUD</text>
    <text x="690" y="720" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="28" fill="#888888" letter-spacing="0.5">CAPTAIN</text>
  </g>
  
  <!-- Card 3: Google Developer Groups -->
  <g filter="url(#cardShadow)">
    <rect x="920" y="380" width="340" height="360" rx="25" fill="#1a1f3a" stroke="#333333" stroke-width="1"/>
    
    <!-- Google Developer Groups Logo (4 colored shapes) -->
    <rect x="1030" y="430" width="35" height="20" rx="10" fill="#4285F4" transform="rotate(-30 1047 440)"/>
    <rect x="1030" y="500" width="35" height="20" rx="10" fill="#EA4335" transform="rotate(30 1047 510)"/>
    <rect x="1090" y="430" width="35" height="20" rx="10" fill="#34A853" transform="rotate(30 1107 440)"/>
    <rect x="1090" y="500" width="35" height="20" rx="10" fill="#FBBC04" transform="rotate(-30 1107 510)"/>
    
    <!-- Text -->
    <text x="1090" y="610" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="1">GOOGLE</text>
    <text x="1090" y="655" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="28" fill="#888888" letter-spacing="0.5">DEVELOPER</text>
    <text x="1090" y="695" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="28" fill="#888888" letter-spacing="0.5">GROUPS</text>
  </g>
  
  <!-- Card 4: LeetCode -->
  <g filter="url(#cardShadow)">
    <rect x="1320" y="380" width="340" height="360" rx="25" fill="#1a1f3a" stroke="#333333" stroke-width="1"/>
    
    <!-- LeetCode Logo (C-shaped with dot) -->
    <path d="M1450,450 Q1480,430 1500,450 Q1520,470 1500,490 Q1480,510 1450,490 Q1430,470 1450,450" 
          fill="none" stroke="#111111" stroke-width="14" stroke-linecap="round"/>
    <path d="M1450,460 Q1475,445 1495,460 Q1510,475 1495,490 Q1475,505 1450,490 Q1435,475 1450,460" 
          fill="none" stroke="#FFA116" stroke-width="12" stroke-linecap="round"/>
    <circle cx="1495" cy="475" r="5" fill="#FFA116"/>
    
    <!-- Text -->
    <text x="1490" y="610" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="1">LEETCODE</text>
    <text x="1490" y="655" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="28" fill="#888888" letter-spacing="0.5">PROBLEM</text>
    <text x="1490" y="695" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="28" fill="#888888" letter-spacing="0.5">SOLVING</text>
  </g>
</svg>