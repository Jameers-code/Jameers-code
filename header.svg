 <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" width="1500" height="600">
  <defs>
    <!-- Main background gradient: dark charcoal with depth -->
    <linearGradient id="bgMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#2a2a2a"/>
      <stop offset="40%"  stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#0e0e0e"/>
    </linearGradient>

    <!-- Vignette edges -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.75"/>
    </radialGradient>

    <!-- Card gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#333333"/>
      <stop offset="100%" stop-color="#1f1f1f"/>
    </linearGradient>

    <!-- Card drop shadow -->
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.7"/>
    </filter>

    <!-- Subtle glow for name text -->
    <filter id="textGlow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.15" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Noise texture for background depth -->
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="overlay" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- Clip for cards -->
    <clipPath id="card1clip"><rect x="82"  y="290" width="285" height="265" rx="22"/></clipPath>
    <clipPath id="card2clip"><rect x="407" y="290" width="285" height="265" rx="22"/></clipPath>
    <clipPath id="card3clip"><rect x="732" y="290" width="285" height="265" rx="22"/></clipPath>
    <clipPath id="card4clip"><rect x="1057" y="290" width="285" height="265" rx="22"/></clipPath>
  </defs>

  <!-- ░░░ BACKGROUND ░░░ -->
  <rect width="1500" height="600" fill="url(#bgMain)"/>
  <!-- Grain texture overlay -->
  <rect width="1500" height="600" fill="#1e1e1e" filter="url(#grain)" opacity="0.4"/>
  <!-- Vignette -->
  <rect width="1500" height="600" fill="url(#vignette)"/>

  <!-- ░░░ NAME ░░░ -->
  <text
    x="750" y="170"
    font-family="'Palatino Linotype', 'Palatino', 'Book Antiqua', 'Georgia', 'Times New Roman', serif"
    font-size="138"
    font-weight="normal"
    fill="#f5f5f5"
    text-anchor="middle"
    letter-spacing="10"
    filter="url(#textGlow)">JAMEER AHMED</text>

  <!-- ░░░ SUBTITLE ░░░ -->
  <text
    x="750" y="228"
    font-family="'Gill Sans', 'Trebuchet MS', 'Century Gothic', 'Arial', sans-serif"
    font-size="30"
    font-weight="300"
    fill="#c8c8c8"
    text-anchor="middle"
    letter-spacing="16">FULL STACK DEVELOPER</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!--              CARD 1 — MICROSOFT                -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="82" y="290" width="285" height="265" rx="22" fill="url(#cardBg)" filter="url(#shadow)"/>
  <rect x="82" y="290" width="285" height="265" rx="22" fill="none" stroke="#444" stroke-width="1.2"/>

  <!-- Microsoft 4-square logo (centered in card) -->
  <!-- Red -->
  <rect x="176" y="316" width="46" height="46" fill="#F25022"/>
  <!-- Green -->
  <rect x="228" y="316" width="46" height="46" fill="#7FBA00"/>
  <!-- Blue -->
  <rect x="176" y="368" width="46" height="46" fill="#00A4EF"/>
  <!-- Yellow -->
  <rect x="228" y="368" width="46" height="46" fill="#FFB900"/>

  <!-- Microsoft label -->
  <text x="224" y="444"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">MICROSOFT</text>
  <text x="224" y="469"
    font-family="'Arial', sans-serif"
    font-size="17" font-weight="400" fill="#aaaaaa" text-anchor="middle">STUDENT</text>
  <text x="224" y="492"
    font-family="'Arial', sans-serif"
    font-size="17" font-weight="400" fill="#aaaaaa" text-anchor="middle">AMBASSADOR</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!--                CARD 2 — AWS                    -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="407" y="290" width="285" height="265" rx="22" fill="url(#cardBg)" filter="url(#shadow)"/>
  <rect x="407" y="290" width="285" height="265" rx="22" fill="none" stroke="#444" stroke-width="1.2"/>

  <!-- AWS text logo -->
  <text x="549" y="375"
    font-family="'Amazon Ember', 'Arial Black', 'Helvetica Neue', sans-serif"
    font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">aws</text>

  <!-- AWS orange smile arrow -->
  <!-- Curved arc from left to right below the text -->
  <path d="M 480 390 Q 549 425 618 390"
    fill="none" stroke="#FF9900" stroke-width="5" stroke-linecap="round"/>
  <!-- Arrowhead on the right -->
  <polygon points="614,383 622,391 614,396" fill="#FF9900"/>

  <!-- AWS label -->
  <text x="549" y="444"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">AWS</text>
  <text x="549" y="469"
    font-family="'Arial', sans-serif"
    font-size="17" font-weight="400" fill="#aaaaaa" text-anchor="middle">CLOUD</text>
  <text x="549" y="492"
    font-family="'Arial', sans-serif"
    font-size="17" font-weight="400" fill="#aaaaaa" text-anchor="middle">CAPTAIN</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!--              CARD 3 — GOOGLE                   -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="732" y="290" width="285" height="265" rx="22" fill="url(#cardBg)" filter="url(#shadow)"/>
  <rect x="732" y="290" width="285" height="265" rx="22" fill="none" stroke="#444" stroke-width="1.2"/>

  <!--
    Google Developer Groups logo:
    Two "<>" chevron-like pill shapes pointing outward.
    Left: Blue pill tilted left + Yellow pill tilted left (forming <)
    Right: Red pill tilted right + Green pill tilted right (forming >)
  -->
  <!-- LEFT GROUP ( < ) -->
  <!-- Blue pill — top-left -->
  <rect x="822" y="322" width="52" height="22" rx="11"
    fill="#4285F4"
    transform="rotate(-40 848 333)"/>
  <!-- Yellow pill — bottom-left -->
  <rect x="822" y="356" width="52" height="22" rx="11"
    fill="#FBBC05"
    transform="rotate(40 848 367)"/>

  <!-- RIGHT GROUP ( > ) -->
  <!-- Red pill — top-right -->
  <rect x="876" y="322" width="52" height="22" rx="11"
    fill="#EA4335"
    transform="rotate(40 902 333)"/>
  <!-- Green pill — bottom-right -->
  <rect x="876" y="356" width="52" height="22" rx="11"
    fill="#34A853"
    transform="rotate(-40 902 367)"/>

  <!-- Google label -->
  <text x="874" y="444"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">GOOGLE</text>
  <text x="874" y="469"
    font-family="'Arial', sans-serif"
    font-size="17" font-weight="400" fill="#aaaaaa" text-anchor="middle">DEVELOPER</text>
  <text x="874" y="492"
    font-family="'Arial', sans-serif"
    font-size="17" font-weight="400" fill="#aaaaaa" text-anchor="middle">GROUPS</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!--             CARD 4 — LEETCODE                  -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="1057" y="290" width="285" height="265" rx="22" fill="url(#cardBg)" filter="url(#shadow)"/>
  <rect x="1057" y="290" width="285" height="265" rx="22" fill="none" stroke="#444" stroke-width="1.2"/>

  <!--
    LeetCode logo — accurate recreation:
    • Bold orange C-arc curving around the right
    • White/light < chevron (thick, rounded) pointing left
    • Two short white horizontal = dashes below-right of chevron
  -->

  <!-- Orange thick C-arc (right side, open to the left) -->
  <!-- Large arc: starts top-right, sweeps around bottom-right -->
  <path d="M 1185 315 C 1230 308, 1262 330, 1268 359 C 1274 388, 1252 412, 1207 420"
    fill="none" stroke="#FFA116" stroke-width="16" stroke-linecap="round"/>

  <!-- White < chevron — two angled arms meeting at a point on the left -->
  <polyline points="1215,322 1172,359 1215,396"
    fill="none" stroke="#e8e8e8" stroke-width="13"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- White = two horizontal dashes (positioned lower-right, inside the arc) -->
  <line x1="1188" y1="374" x2="1222" y2="374" stroke="#e8e8e8" stroke-width="10" stroke-linecap="round"/>
  <line x1="1188" y1="394" x2="1222" y2="394" stroke="#e8e8e8" stroke-width="10" stroke-linecap="round"/>

  <!-- LeetCode label -->
  <text x="1199" y="444"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">LEETCODE</text>
  <text x="1199" y="469"
    font-family="'Arial', sans-serif"
    font-size="17" font-weight="400" fill="#aaaaaa" text-anchor="middle">PROBLEM</text>
  <text x="1199" y="492"
    font-family="'Arial', sans-serif"
    font-size="17" font-weight="400" fill="#aaaaaa" text-anchor="middle">SOLVING</text>

</svg>
