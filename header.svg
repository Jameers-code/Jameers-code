<svg viewBox="0 0 1400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0d0d;stop-opacity:1" />
    </linearGradient>
    
    <!-- Card background gradient -->
    <radialGradient id="cardGradient" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#3a3a3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f1f1f;stop-opacity:1" />
    </radialGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Main background -->
  <rect width="1400" height="500" fill="url(#bgGradient)"/>
  
  <!-- Subtle vignette -->
  <rect width="1400" height="500" fill="#000000" opacity="0.15"/>

  <!-- JAMEER AHMED - Main Title -->
  <text x="700" y="130" 
    font-family="Georgia, serif" 
    font-size="110" 
    font-weight="300" 
    fill="#ffffff" 
    text-anchor="middle"
    letter-spacing="8"
    style="text-shadow: 0 2px 10px rgba(0,0,0,0.5);">JAMEER AHMED</text>

  <!-- FULL STACK DEVELOPER - Subtitle -->
  <text x="700" y="185" 
    font-family="Arial, sans-serif" 
    font-size="26" 
    font-weight="300" 
    fill="#d0d0d0" 
    text-anchor="middle"
    letter-spacing="12">FULL STACK DEVELOPER</text>

  <!-- ===== CARD 1: MICROSOFT STUDENT AMBASSADOR ===== -->
  <g filter="url(#shadow)">
    <!-- Card background -->
    <rect x="145" y="280" width="220" height="180" rx="18" fill="url(#cardGradient)" stroke="#404040" stroke-width="1"/>
    
    <!-- Microsoft Logo (4 squares) -->
    <rect x="205" y="300" width="22" height="22" fill="#F25022"/>
    <rect x="232" y="300" width="22" height="22" fill="#7FBA00"/>
    <rect x="205" y="327" width="22" height="22" fill="#00A4EF"/>
    <rect x="232" y="327" width="22" height="22" fill="#FFB900"/>
    
    <!-- Text -->
    <text x="255" y="380" 
      font-family="Arial, sans-serif" 
      font-size="16" 
      font-weight="bold" 
      fill="#ffffff" 
      text-anchor="middle">MICROSOFT</text>
    <text x="255" y="400" 
      font-family="Arial, sans-serif" 
      font-size="13" 
      font-weight="normal" 
      fill="#aaaaaa" 
      text-anchor="middle">STUDENT</text>
    <text x="255" y="418" 
      font-family="Arial, sans-serif" 
      font-size="13" 
      font-weight="normal" 
      fill="#aaaaaa" 
      text-anchor="middle">AMBASSADOR</text>
  </g>

  <!-- ===== CARD 2: AWS CLOUD CAPTAIN ===== -->
  <g filter="url(#shadow)">
    <!-- Card background -->
    <rect x="425" y="280" width="220" height="180" rx="18" fill="url(#cardGradient)" stroke="#404040" stroke-width="1"/>
    
    <!-- AWS text -->
    <text x="535" y="340" 
      font-family="Arial, sans-serif" 
      font-size="48" 
      font-weight="bold" 
      fill="#ffffff" 
      text-anchor="middle">aws</text>
    
    <!-- AWS smile arc -->
    <path d="M 495 355 Q 535 375 575 355" 
      fill="none" 
      stroke="#FF9900" 
      stroke-width="5" 
      stroke-linecap="round"/>
    
    <!-- Text -->
    <text x="535" y="380" 
      font-family="Arial, sans-serif" 
      font-size="16" 
      font-weight="bold" 
      fill="#ffffff" 
      text-anchor="middle">AWS</text>
    <text x="535" y="400" 
      font-family="Arial, sans-serif" 
      font-size="13" 
      font-weight="normal" 
      fill="#aaaaaa" 
      text-anchor="middle">CLOUD</text>
    <text x="535" y="418" 
      font-family="Arial, sans-serif" 
      font-size="13" 
      font-weight="normal" 
      fill="#aaaaaa" 
      text-anchor="middle">CAPTAIN</text>
  </g>

  <!-- ===== CARD 3: GOOGLE DEVELOPER GROUPS ===== -->
  <g filter="url(#shadow)">
    <!-- Card background -->
    <rect x="705" y="280" width="220" height="180" rx="18" fill="url(#cardGradient)" stroke="#404040" stroke-width="1"/>
    
    <!-- Google Developers Logos (pills/capsules) -->
    <!-- Red pill -->
    <rect x="745" y="305" width="28" height="14" rx="7" fill="#EA4335" transform="rotate(-25 759 312)"/>
    <!-- Green pill -->
    <rect x="790" y="305" width="28" height="14" rx="7" fill="#34A853" transform="rotate(25 804 312)"/>
    <!-- Blue pill -->
    <rect x="755" y="335" width="28" height="14" rx="7" fill="#4285F4" transform="rotate(25 769 342)"/>
    <!-- Yellow pill -->
    <rect x="800" y="335" width="28" height="14" rx="7" fill="#FBBC05" transform="rotate(-25 814 342)"/>
    
    <!-- Text -->
    <text x="815" y="380" 
      font-family="Arial, sans-serif" 
      font-size="16" 
      font-weight="bold" 
      fill="#ffffff" 
      text-anchor="middle">GOOGLE</text>
    <text x="815" y="400" 
      font-family="Arial, sans-serif" 
      font-size="13" 
      font-weight="normal" 
      fill="#aaaaaa" 
      text-anchor="middle">DEVELOPER</text>
    <text x="815" y="418" 
      font-family="Arial, sans-serif" 
      font-size="13" 
      font-weight="normal" 
      fill="#aaaaaa" 
      text-anchor="middle">GROUPS</text>
  </g>

  <!-- ===== CARD 4: LEETCODE PROBLEM SOLVING ===== -->
  <g filter="url(#shadow)">
    <!-- Card background -->
    <rect x="985" y="280" width="220" height="180" rx="18" fill="url(#cardGradient)" stroke="#404040" stroke-width="1"/>
    
    <!-- LeetCode Logo -->
    <!-- Orange curved bracket -->
    <path d="M 1045 310 Q 1030 325 1045 340" 
      fill="none" 
      stroke="#FFA116" 
      stroke-width="12" 
      stroke-linecap="round"/>
    
    <!-- White horizontal bars -->
    <rect x="1055" y="318" width="30" height="4" fill="#ffffff" rx="2"/>
    <rect x="1055" y="332" width="30" height="4" fill="#ffffff" rx="2"/>
    
    <!-- Orange equal sign base -->
    <rect x="1090" y="318" width="20" height="4" fill="#FFA116" rx="2"/>
    <rect x="1090" y="332" width="20" height="4" fill="#FFA116" rx="2"/>
    
    <!-- Text -->
    <text x="1095" y="380" 
      font-family="Arial, sans-serif" 
      font-size="16" 
      font-weight="bold" 
      fill="#ffffff" 
      text-anchor="middle">LEETCODE</text>
    <text x="1095" y="400" 
      font-family="Arial, sans-serif" 
      font-size="13" 
      font-weight="normal" 
      fill="#aaaaaa" 
      text-anchor="middle">PROBLEM</text>
    <text x="1095" y="418" 
      font-family="Arial, sans-serif" 
      font-size="13" 
      font-weight="normal" 
      fill="#aaaaaa" 
      text-anchor="middle">SOLVING</text>
  </g>
</svg>