<svg viewBox="0 0 1400 500" xmlns="http://www.w3.org/2000/svg" width="1400" height="500">
  <defs>
    <!-- Dark background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0d0d;stop-opacity:1" />
    </linearGradient>
    <!-- Card gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2e2e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1e1e;stop-opacity:1" />
    </linearGradient>
    <!-- Subtle vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" style="stop-color:#000000;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.6" />
    </radialGradient>
    <!-- Card shadow filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <!-- Subtle noise texture -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="overlay" result="noisy"/>
      <feComposite in="noisy" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="500" fill="url(#bgGrad)"/>
  <!-- Subtle texture overlay -->
  <rect width="1400" height="500" fill="#222" opacity="0.3" filter="url(#noise)"/>
  <!-- Vignette overlay -->
  <rect width="1400" height="500" fill="url(#vignette)"/>

  <!-- NAME: JAMEER AHMED in large serif style -->
  <text x="700" y="140"
    font-family="'Georgia', 'Times New Roman', serif"
    font-size="120"
    font-weight="300"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="12"
    style="font-variant: normal;">JAMEER AHMED</text>

  <!-- Subtitle: FULL STACK DEVELOPER -->
  <text x="700" y="200"
    font-family="'Trebuchet MS', 'Arial', sans-serif"
    font-size="28"
    font-weight="300"
    fill="#cccccc"
    text-anchor="middle"
    letter-spacing="14">FULL STACK DEVELOPER</text>

  <!-- ===== CARD 1: MICROSOFT ===== -->
  <!-- Card background -->
  <rect x="120" y="270" width="240" height="200" rx="20" ry="20" fill="url(#cardGrad)" filter="url(#cardShadow)"/>
  <rect x="120" y="270" width="240" height="200" rx="20" ry="20" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>

  <!-- Microsoft Logo (4 colored squares) -->
  <!-- Red square -->
  <rect x="185" y="300" width="30" height="30" fill="#F25022"/>
  <!-- Green square -->
  <rect x="220" y="300" width="30" height="30" fill="#7FBA00"/>
  <!-- Blue square -->
  <rect x="185" y="335" width="30" height="30" fill="#00A4EF"/>
  <!-- Yellow square -->
  <rect x="220" y="335" width="30" height="30" fill="#FFB900"/>

  <!-- Microsoft text -->
  <text x="240" y="395"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-size="18"
    font-weight="800"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="0.5">MICROSOFT</text>
  <text x="240" y="417"
    font-family="'Arial', sans-serif"
    font-size="15"
    font-weight="400"
    fill="#bbbbbb"
    text-anchor="middle">STUDENT</text>
  <text x="240" y="438"
    font-family="'Arial', sans-serif"
    font-size="15"
    font-weight="400"
    fill="#bbbbbb"
    text-anchor="middle">AMBASSADOR</text>

  <!-- ===== CARD 2: AWS ===== -->
  <rect x="430" y="270" width="240" height="200" rx="20" ry="20" fill="url(#cardGrad)" filter="url(#cardShadow)"/>
  <rect x="430" y="270" width="240" height="200" rx="20" ry="20" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>

  <!-- AWS Logo text "aws" -->
  <text x="550" y="345"
    font-family="'Arial Black', 'Helvetica Neue', sans-serif"
    font-size="38"
    font-weight="900"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="1">aws</text>
  <!-- AWS smile arrow (orange arc) -->
  <path d="M 495 360 Q 550 385 605 360"
    fill="none"
    stroke="#FF9900"
    stroke-width="4"
    stroke-linecap="round"/>
  <!-- Arrow tip on the right -->
  <polygon points="602,352 612,360 602,368" fill="#FF9900"/>

  <!-- AWS text -->
  <text x="550" y="395"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-size="18"
    font-weight="800"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="0.5">AWS</text>
  <text x="550" y="417"
    font-family="'Arial', sans-serif"
    font-size="15"
    font-weight="400"
    fill="#bbbbbb"
    text-anchor="middle">CLOUD</text>
  <text x="550" y="438"
    font-family="'Arial', sans-serif"
    font-size="15"
    font-weight="400"
    fill="#bbbbbb"
    text-anchor="middle">CAPTAIN</text>

  <!-- ===== CARD 3: GOOGLE ===== -->
  <rect x="740" y="270" width="240" height="200" rx="20" ry="20" fill="url(#cardGrad)" filter="url(#cardShadow)"/>
  <rect x="740" y="270" width="240" height="200" rx="20" ry="20" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>

  <!-- Google Developer Groups Logo (pill shapes) -->
  <!-- Blue pill (left, angled) -->
  <rect x="790" y="305" width="50" height="24" rx="12" ry="12" fill="#4285F4" transform="rotate(-35 815 317)"/>
  <!-- Red pill (top right, angled) -->
  <rect x="835" y="305" width="50" height="24" rx="12" ry="12" fill="#EA4335" transform="rotate(35 860 317)"/>
  <!-- Yellow pill (bottom left, angled) -->
  <rect x="790" y="335" width="50" height="24" rx="12" ry="12" fill="#FBBC05" transform="rotate(35 815 347)"/>
  <!-- Green pill (bottom right, angled) -->
  <rect x="835" y="335" width="50" height="24" rx="12" ry="12" fill="#34A853" transform="rotate(-35 860 347)"/>

  <!-- Google text -->
  <text x="860" y="395"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-size="18"
    font-weight="800"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="0.5">GOOGLE</text>
  <text x="860" y="417"
    font-family="'Arial', sans-serif"
    font-size="15"
    font-weight="400"
    fill="#bbbbbb"
    text-anchor="middle">DEVELOPER</text>
  <text x="860" y="438"
    font-family="'Arial', sans-serif"
    font-size="15"
    font-weight="400"
    fill="#bbbbbb"
    text-anchor="middle">GROUPS</text>

  <!-- ===== CARD 4: LEETCODE ===== -->
  <rect x="1050" y="270" width="240" height="200" rx="20" ry="20" fill="url(#cardGrad)" filter="url(#cardShadow)"/>
  <rect x="1050" y="270" width="240" height="200" rx="20" ry="20" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>

  <!-- LeetCode Logo (stylized C with < and =) -->
  <!-- Outer orange arc -->
  <path d="M 1155 300 A 30 30 0 0 0 1155 360"
    fill="none"
    stroke="#FFA116"
    stroke-width="11"
    stroke-linecap="round"/>
  <!-- < chevron (white) -->
  <polyline points="1140,315 1122,330 1140,345"
    fill="none"
    stroke="#ffffff"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"/>
  <!-- = two lines (white) -->
  <line x1="1130" y1="320" x2="1150" y2="320" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <line x1="1130" y1="335" x2="1150" y2="335" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>

  <!-- Leetcode text -->
  <text x="1170" y="395"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-size="18"
    font-weight="800"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="0.5">LEETCODE</text>
  <text x="1170" y="417"
    font-family="'Arial', sans-serif"
    font-size="15"
    font-weight="400"
    fill="#bbbbbb"
    text-anchor="middle">PROBLEM</text>
  <text x="1170" y="438"
    font-family="'Arial', sans-serif"
    font-size="15"
    font-weight="400"
    fill="#bbbbbb"
    text-anchor="middle">SOLVING</text>

</svg>