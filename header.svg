<svg viewBox="0 0 1600 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1600" height="800" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="800" y="160" font-family="Georgia, serif" font-size="130" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="12">
    JAMEER AHMED
  </text>
  
  <!-- Subtitle -->
  <text x="800" y="260" font-family="Arial, sans-serif" font-size="52" fill="#888888" text-anchor="middle" letter-spacing="14">
    FULL STACK DEVELOPER
  </text>
  
  <!-- Line -->
  <line x1="320" y1="310" x2="1280" y2="310" stroke="#666666" stroke-width="2"/>
  
  <!-- CARD 1: MICROSOFT -->
  <g filter="url(#shadow)">
    <rect x="100" y="360" width="330" height="380" rx="30" fill="#1a1f3a" stroke="#2a2f4a" stroke-width="1"/>
    
    <!-- Microsoft Logo Squares -->
    <rect x="195" y="400" width="50" height="50" fill="#F25022"/>
    <rect x="260" y="400" width="50" height="50" fill="#7FBA00"/>
    <rect x="195" y="465" width="50" height="50" fill="#00A4EF"/>
    <rect x="260" y="465" width="50" height="50" fill="#FFB900"/>
    
    <!-- Text -->
    <text x="265" y="600" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle">MICROSOFT</text>
    <text x="265" y="645" font-family="Arial, sans-serif" font-size="26" fill="#999999" text-anchor="middle">STUDENT</text>
    <text x="265" y="685" font-family="Arial, sans-serif" font-size="26" fill="#999999" text-anchor="middle">AMBASSADOR</text>
  </g>
  
  <!-- CARD 2: AWS -->
  <g filter="url(#shadow)">
    <rect x="480" y="360" width="330" height="380" rx="30" fill="#0d2a4a" stroke="#1a4a7a" stroke-width="2"/>
    
    <!-- AWS Logo -->
    <g transform="translate(645, 450)">
      <!-- AWS Text -->
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="85" font-weight="bold" fill="#ffffff" text-anchor="middle">aws</text>
      <!-- Arrow/Smile -->
      <path d="M -40 35 Q 0 65 40 35" fill="none" stroke="#FF9900" stroke-width="8" stroke-linecap="round"/>
    </g>
    
    <!-- Text -->
    <text x="645" y="620" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle">AWS</text>
    <text x="645" y="665" font-family="Arial, sans-serif" font-size="26" fill="#999999" text-anchor="middle">CLOUD</text>
    <text x="645" y="705" font-family="Arial, sans-serif" font-size="26" fill="#999999" text-anchor="middle">CAPTAIN</text>
  </g>
  
  <!-- CARD 3: GOOGLE -->
  <g filter="url(#shadow)">
    <rect x="860" y="360" width="330" height="380" rx="30" fill="#1a1f3a" stroke="#2a2f4a" stroke-width="1"/>
    
    <!-- Google Developer Groups Logo -->
    <g transform="translate(1025, 430)">
      <!-- Red/Orange left arrow -->
      <path d="M -35 -25 L -5 0 L -35 25" fill="none" stroke="#EA4335" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Blue middle arrow -->
      <path d="M -10 -25 L 20 0 L -10 25" fill="none" stroke="#4285F4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Green right arrow -->
      <path d="M 15 -25 L 45 0 L 15 25" fill="none" stroke="#34A853" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Yellow bottom right -->
      <path d="M 40 0 L 70 25 L 40 50" fill="none" stroke="#FBBC04" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Text -->
    <text x="1025" y="620" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle">GOOGLE</text>
    <text x="1025" y="665" font-family="Arial, sans-serif" font-size="26" fill="#999999" text-anchor="middle">DEVELOPER</text>
    <text x="1025" y="705" font-family="Arial, sans-serif" font-size="26" fill="#999999" text-anchor="middle">GROUPS</text>
  </g>
  
  <!-- CARD 4: LEETCODE -->
  <g filter="url(#shadow)">
    <rect x="1240" y="360" width="330" height="380" rx="30" fill="#1a1f3a" stroke="#2a2f4a" stroke-width="1"/>
    
    <!-- LeetCode Logo - Orange C with dot -->
    <g transform="translate(1405, 450)">
      <!-- Orange C shape -->
      <path d="M 0 -35 Q -40 -25 -40 0 Q -40 25 0 35 Q 15 40 30 25" 
            fill="none" stroke="#FFA116" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Gray circle inside -->
      <circle cx="15" cy="0" r="8" fill="#666666"/>
    </g>
    
    <!-- Text -->
    <text x="1405" y="620" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle">LEETCODE</text>
    <text x="1405" y="665" font-family="Arial, sans-serif" font-size="26" fill="#999999" text-anchor="middle">PROBLEM</text>
    <text x="1405" y="705" font-family="Arial, sans-serif" font-size="26" fill="#999999" text-anchor="middle">SOLVING</text>
  </g>
</svg>